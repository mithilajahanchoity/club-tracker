name: Sync platform activity

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (GitHub may delay it a few minutes)
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: platform-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Sync Codeforces and GitHub
        run: node scripts/sync/sync.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
